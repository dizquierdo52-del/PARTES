<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mbo'ehao Pro - Gestión Directiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --primary: #4f46e5;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            transition: all 0.3s ease; 
        }

        .row-active {
            background: linear-gradient(to right, #f8fafc, #ffffff);
            border-left: 6px solid var(--primary);
            position: relative;
        }

        .row-active::after {
            content: 'EN CLASE';
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: 0.1em;
            opacity: 0.6;
        }

        .pulse-danger {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @media print {
            .no-print { display: none; }
            body { background: white; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-2xl no-print">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">Mbo'ehao <span class="text-indigo-400">Control</span></h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Gestión Directiva Local</p>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="text-right hidden sm:block border-r border-slate-700 pr-6">
                    <p id="currentDate" class="text-[10px] text-indigo-300 font-bold uppercase"></p>
                    <p id="currentTime" class="text-2xl font-black font-mono tracking-tighter text-white">00:00:00</p>
                </div>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl transition-all border border-slate-700">
                    <i data-lucide="printer" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 lg:p-8">
        
        <!-- Carga y Filtros -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8 no-print">
            
            <div class="lg:col-span-3 bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200">
                <div class="flex items-center gap-3 mb-4">
                    <i data-lucide="upload-cloud" class="w-5 h-5 text-indigo-500"></i>
                    <h2 class="text-sm font-black uppercase tracking-widest text-slate-500">Actualizar Datos</h2>
                </div>
                <label class="group cursor-pointer">
                    <div class="border-2 border-dashed border-slate-200 rounded-3xl p-6 text-center group-hover:border-indigo-400 transition-all bg-slate-50">
                        <p id="fileStatusLabel" class="text-[10px] font-bold text-slate-500 group-hover:text-indigo-600 uppercase">Cargar Archivo JSON</p>
                    </div>
                    <input type="file" id="jsonUpload" class="hidden" accept=".json" />
                </label>
                <button id="clearStorage" class="w-full mt-3 text-[9px] text-red-400 font-bold uppercase hover:text-red-600 transition-colors">Eliminar datos guardados</button>
            </div>

            <div class="lg:col-span-9 bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-3">
                        <i data-lucide="filter" class="w-5 h-5 text-indigo-500"></i>
                        <h2 class="text-sm font-black uppercase tracking-widest text-slate-500">Filtros de Búsqueda</h2>
                    </div>
                    <button id="resetFilters" class="text-[10px] font-black text-red-500 hover:bg-red-50 px-3 py-1 rounded-full uppercase transition-colors">Reiniciar</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <!-- Filtro Curso -->
                    <div class="flex flex-col gap-1">
                        <label class="text-[9px] font-bold text-slate-400 uppercase ml-2">Curso / Div</label>
                        <select id="filterCurso" class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold outline-none focus:border-indigo-500">
                            <option value="ALL">TODOS LOS CURSOS</option>
                        </select>
                    </div>

                    <!-- Filtro Docente -->
                    <div class="flex flex-col gap-1">
                        <label class="text-[9px] font-bold text-slate-400 uppercase ml-2">Docente</label>
                        <select id="filterProfesor" class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold outline-none focus:border-indigo-500">
                            <option value="ALL">TODOS LOS DOCENTES</option>
                        </select>
                    </div>

                    <!-- Filtro Módulo -->
                    <div class="flex flex-col gap-1">
                        <label class="text-[9px] font-bold text-slate-400 uppercase ml-2">Módulo</label>
                        <select id="filterModulo" class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold outline-none focus:border-indigo-500">
                            <option value="ALL">TODOS LOS MÓDULOS</option>
                        </select>
                    </div>

                    <!-- Búsqueda Global -->
                    <div class="flex flex-col gap-1">
                        <label class="text-[9px] font-bold text-slate-400 uppercase ml-2">Búsqueda Rápida</label>
                        <input type="text" id="globalSearch" placeholder="Ej: Matemática..." 
                        class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Registros</p>
                <p id="statTotal" class="text-3xl font-black text-slate-800">0</p>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-lg border-b-4 border-indigo-500">
                <p class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mb-1">En Clase Ahora</p>
                <p id="statActivos" class="text-3xl font-black text-indigo-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-orange-400 uppercase tracking-widest mb-1">Reemplazos</p>
                <p id="statSuplentes" class="text-3xl font-black text-orange-500">0</p>
            </div>
            <div id="alertBox" class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 hidden">
                <p class="text-[10px] font-bold text-red-500 uppercase tracking-widest mb-1">Sin Docente</p>
                <p id="statAlertas" class="text-3xl font-black text-red-600">0</p>
            </div>
        </div>

        <!-- Tabla -->
        <div class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden">
            <div class="p-6 md:p-8 border-b border-slate-100 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <h3 class="font-extrabold text-lg text-slate-800 uppercase tracking-tighter">Planilla de Control</h3>
                </div>
                <span id="dayBadge" class="px-4 py-1.5 bg-slate-900 text-white text-[10px] font-black rounded-full uppercase tracking-widest italic">---</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-[9px] uppercase font-bold text-slate-400 tracking-[0.2em]">
                            <th class="px-8 py-5">Horario / Bloque</th>
                            <th class="px-8 py-5">Curso / División</th>
                            <th class="px-8 py-5">Asignatura</th>
                            <th class="px-8 py-5">Personal Responsable</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="text-center py-32">
                                <p class="font-black uppercase tracking-widest text-xs text-slate-300">Esperando archivo JSON...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let rawData = [];
        const DIAS_ES = { 0: "DOMINGO", 1: "LUNES", 2: "MARTES", 3: "MIERCOLES", 4: "JUEVES", 5: "VIERNES", 6: "SABADO" };
        const STORAGE_KEY = 'mbo_ehao_cache_data';

        lucide.createIcons();

        // --- INICIALIZACIÓN ---
        window.onload = function() {
            updateClock();
            loadStoredData();
        };

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('es-AR', { hour12: false });
            document.getElementById('currentDate').textContent = now.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('dayBadge').textContent = DIAS_ES[now.getDay()];
            if (now.getSeconds() === 0 && rawData.length > 0) renderTable();
        }
        setInterval(updateClock, 1000);

        function normalizeCourseName(name) {
            if (!name) return "S/D";
            let clean = name.replace('.docx', '').replace('.json', '').replace('PARTES ', '').replace('PLANILLA ', '');
            return clean.replace(/[ªº]/g, '°').trim();
        }

        function cleanString(str) {
            if (!str) return "";
            return str.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") 
                .replace(/,/g, "")               
                .replace(/\s+/g, " ")            
                .trim();
        }

        // --- PERSISTENCIA DE DATOS ---
        function loadStoredData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    rawData = JSON.parse(stored);
                    updateFilterOptions();
                    renderTable();
                    document.getElementById('fileStatusLabel').textContent = "Datos cargados (Memoria)";
                    showCustomMessage("Datos recuperados automáticamente");
                } catch (e) {
                    localStorage.removeItem(STORAGE_KEY);
                }
            }
        }

        function saveToStorage(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error("Error al guardar en memoria local:", e);
            }
        }

        document.getElementById('clearStorage').addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            rawData = [];
            location.reload();
        });

        function unifyTeachers(data) {
            const teacherMap = new Map();
            const subjectTeacherMatch = {}; 

            data.forEach(item => {
                const rawName = item.profesor || "";
                if (!rawName || rawName.trim() === "") return;
                
                const cleaned = cleanString(rawName);
                const subject = cleanString(item.espacio_curricular);
                
                if (!teacherMap.has(cleaned) || rawName.length > teacherMap.get(cleaned).length) {
                    teacherMap.set(cleaned, rawName.replace(/,/g, "").trim());
                }

                if (subject) {
                    if (!subjectTeacherMatch[subject]) subjectTeacherMatch[subject] = [];
                    if (!subjectTeacherMatch[subject].includes(cleaned)) {
                        subjectTeacherMatch[subject].push(cleaned);
                    }
                }
            });

            return data.map(item => {
                const rawName = item.profesor || "";
                if (!rawName) return item;
                const cleaned = cleanString(rawName);
                const subject = cleanString(item.espacio_curricular);
                let finalName = teacherMap.get(cleaned) || rawName;

                if (subject && subjectTeacherMatch[subject]) {
                    const potentialMatches = subjectTeacherMatch[subject];
                    const betterMatch = potentialMatches.find(m => m !== cleaned && m.includes(cleaned));
                    if (betterMatch) finalName = teacherMap.get(betterMatch);
                }
                return { ...item, profesor: finalName };
            });
        }

        document.getElementById('jsonUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const json = JSON.parse(event.target.result);
                    let processedData = json.filter(item => item.hora && item.hora.toLowerCase() !== "hora");
                    
                    rawData = unifyTeachers(processedData);
                    
                    // Guardar para futuros usos
                    saveToStorage(rawData);
                    
                    document.getElementById('fileStatusLabel').textContent = "Archivo Cargado y Guardado";
                    updateFilterOptions();
                    renderTable();
                } catch (err) {
                    showCustomMessage("Error en el archivo JSON.");
                }
            };
            reader.readAsText(file);
        });

        function updateFilterOptions() {
            const cursos = [...new Set(rawData.map(i => normalizeCourseName(i.archivo_origen)))].sort();
            const modulos = [...new Set(rawData.map(i => i.hora))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
            const profesores = [...new Set(rawData.map(i => i.profesor).filter(p => p && p.trim() !== ""))].sort();

            const cSelect = document.getElementById('filterCurso');
            const mSelect = document.getElementById('filterModulo');
            const pSelect = document.getElementById('filterProfesor');

            cSelect.innerHTML = '<option value="ALL">TODOS LOS CURSOS</option>';
            cursos.forEach(c => cSelect.innerHTML += `<option value="${c}">${c}</option>`);

            mSelect.innerHTML = '<option value="ALL">TODOS LOS MÓDULOS</option>';
            modulos.forEach(m => mSelect.innerHTML += `<option value="${m}">${m}</option>`);

            pSelect.innerHTML = '<option value="ALL">TODOS LOS DOCENTES</option>';
            profesores.forEach(p => pSelect.innerHTML += `<option value="${p}">${p}</option>`);
        }

        function isCurrentModule(horarioStr) {
            if (!horarioStr || !horarioStr.includes(' a ')) return false;
            try {
                const [start, end] = horarioStr.toLowerCase().split(' a ');
                const now = new Date();
                const nowTotal = now.getHours() * 60 + now.getMinutes();
                const parseMinutes = (time) => {
                    const clean = time.trim().replace('.', ':');
                    const [h, m] = clean.split(':').map(Number);
                    return h * 60 + (m || 0);
                };
                return nowTotal >= parseMinutes(start) && nowTotal <= parseMinutes(end);
            } catch (e) { return false; }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const currentDay = DIAS_ES[new Date().getDay()];
            
            const fSearch = document.getElementById('globalSearch').value.toLowerCase();
            const fCurso = document.getElementById('filterCurso').value;
            const fModulo = document.getElementById('filterModulo').value;
            const fProfesor = document.getElementById('filterProfesor').value;

            const filtered = rawData.filter(item => {
                const itemDay = (item.dia || "").toUpperCase();
                const dayMatch = itemDay.includes(currentDay.substring(0, 4)) || itemDay.includes(currentDay);
                const searchMatch = (item.espacio_curricular || "").toLowerCase().includes(fSearch);
                const courseMatch = fCurso === 'ALL' || normalizeCourseName(item.archivo_origen) === fCurso;
                const moduleMatch = fModulo === 'ALL' || item.hora === fModulo;
                const teacherMatch = fProfesor === 'ALL' || item.profesor === fProfesor;

                return dayMatch && searchMatch && courseMatch && moduleMatch && teacherMatch;
            }).sort((a, b) => {
                const aActive = isCurrentModule(a.horario);
                const bActive = isCurrentModule(b.horario);
                if (aActive && !bActive) return -1;
                if (!aActive && bActive) return 1;
                return a.horario.localeCompare(b.horario);
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-24 text-slate-400 italic text-xs">No hay registros para los filtros seleccionados hoy.</td></tr>`;
                resetStats();
                return;
            }

            let html = '';
            let stats = { total: filtered.length, activos: 0, suplentes: 0, alertas: 0 };

            filtered.forEach(item => {
                const active = isCurrentModule(item.horario);
                const noAsignatura = !item.espacio_curricular || item.espacio_curricular.trim() === "";
                const isSuplente = item.suplente && item.suplente.trim().length > 2;
                const noDocente = !item.profesor || item.profesor.trim() === "";

                if (active) stats.activos++;
                if (isSuplente && !noAsignatura) stats.suplentes++;
                if (active && noDocente && !noAsignatura) stats.alertas++;

                html += `
                    <tr class="${active ? 'row-active z-10 shadow-sm' : 'hover:bg-slate-50 transition-colors'}">
                        <td class="px-8 py-5">
                            <div class="flex items-center gap-3">
                                ${active ? '<span class="relative flex h-2 w-2"><span class="animate-ping absolute h-full w-full rounded-full bg-indigo-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span></span>' : ''}
                                <div>
                                    <div class="text-xs font-black ${active ? 'text-indigo-600' : 'text-slate-700'}">${item.hora}</div>
                                    <div class="text-[9px] font-bold text-slate-400 font-mono">${item.horario}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-8 py-5">
                            <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-[10px] font-black border border-slate-200">
                                ${normalizeCourseName(item.archivo_origen)}
                            </span>
                        </td>
                        <td class="px-8 py-5 text-xs font-bold ${noAsignatura ? 'text-slate-300 italic uppercase' : 'text-slate-800'}">
                            ${noAsignatura ? 'Libre / Sin Asignatura' : item.espacio_curricular}
                        </td>
                        <td class="px-8 py-5">
                            ${noAsignatura ? `
                                <span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest italic">N/A</span>
                            ` : `
                                <div class="flex flex-col gap-1">
                                    <div class="text-xs font-black ${noDocente ? 'text-red-500 italic' : 'text-slate-700'}">
                                        ${noDocente ? '⚠️ SIN DOCENTE' : item.profesor}
                                    </div>
                                    ${isSuplente ? `
                                        <span class="bg-orange-100 text-orange-600 text-[9px] px-2 py-0.5 rounded-md font-black uppercase flex items-center gap-1 w-fit border border-orange-200">
                                            SUPLENTE: ${item.suplente}
                                        </span>
                                    ` : '<span class="text-[9px] font-bold text-slate-300 uppercase tracking-widest">Titular</span>'}
                                </div>
                            `}
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            updateStatsUI(stats);
            lucide.createIcons();
        }

        function updateStatsUI(s) {
            document.getElementById('statTotal').textContent = s.total;
            document.getElementById('statActivos').textContent = s.activos;
            document.getElementById('statSuplentes').textContent = s.suplentes;
            const alertBox = document.getElementById('alertBox');
            if (s.alertas > 0) {
                alertBox.classList.remove('hidden');
                alertBox.classList.add('pulse-danger', 'bg-red-50');
                document.getElementById('statAlertas').textContent = s.alertas;
            } else { alertBox.classList.add('hidden'); }
        }

        function resetStats() { updateStatsUI({ total: 0, activos: 0, suplentes: 0, alertas: 0 }); }

        function showCustomMessage(msg) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl z-[100] font-bold text-xs animate-bounce";
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        ['filterCurso', 'filterModulo', 'filterProfesor'].forEach(id => {
            document.getElementById(id).addEventListener('change', renderTable);
        });
        document.getElementById('globalSearch').addEventListener('input', renderTable);
        document.getElementById('resetFilters').addEventListener('click', () => {
            document.getElementById('filterCurso').value = 'ALL';
            document.getElementById('filterModulo').value = 'ALL';
            document.getElementById('filterProfesor').value = 'ALL';
            document.getElementById('globalSearch').value = '';
            renderTable();
        });

    </script>
</body>
</html>
